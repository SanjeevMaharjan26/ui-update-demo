<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <ng-content></ng-content>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel.emit()">{{ cancelLabel }}</button>
  <button mat-raised-button color="primary" type="button" (click)="save.emit()" [disabled]="saveDisabled">{{ saveLabel }}</button>
</mat-dialog-actions>
