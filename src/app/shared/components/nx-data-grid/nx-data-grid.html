<div class="nx-data-grid">
  @if (showSearch) {
    <div class="nx-data-grid__search">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>{{ searchPlaceholder }}</mat-label>
        <input matInput (keyup)="applyFilter($event)" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  }

  <div class="nx-data-grid__table">
    <table mat-table [dataSource]="dataSource" matSort class="nx-grid-table">
      @for (col of columns; track col.key) {
        <ng-container [matColumnDef]="col.key">
          <th mat-header-cell *matHeaderCellDef
              [mat-sort-header]="col.sortable ? col.key : ''"
              [disabled]="!col.sortable"
              [style.width]="col.width">
            {{ col.header }}
          </th>
          <td mat-cell *matCellDef="let row">
            @switch (col.type) {
              @case ('status')   { <nx-status-chip [status]="row[col.key]"></nx-status-chip> }
              @case ('badge')    { <nx-badge [label]="row[col.key]"></nx-badge> }
              @case ('currency') { {{ row[col.key] | currency }} }
              @default           { {{ row[col.key] }}  }
            }
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">
          <nx-empty-state message="No records found"></nx-empty-state>
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons>
  </mat-paginator>
</div>
