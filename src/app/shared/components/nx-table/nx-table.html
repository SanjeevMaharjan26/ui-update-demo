<div class="nx-table-wrapper">
  <table mat-table [dataSource]="data" class="nx-table">
    <ng-container matColumnDef="_index">
      <th mat-header-cell *matHeaderCellDef class="index-col">#</th>
      <td mat-cell *matCellDef="let i = index" class="index-col">{{ i + 1 }}</td>
    </ng-container>

    @for (col of columns; track col.key) {
      <ng-container [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef [style.width]="col.width">{{ col.header }}</th>
        <td mat-cell *matCellDef="let row">
          @switch (col.type) {
            @case ('status') { <nx-status-chip [status]="row[col.key]"></nx-status-chip> }
            @case ('badge')  { <nx-badge [label]="row[col.key]"></nx-badge> }
            @case ('currency') { <span>{{ row[col.key] | currency }}</span> }
            @default { <span>{{ row[col.key] }}</span> }
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">
        <nx-empty-state></nx-empty-state>
      </td>
    </tr>
  </table>
</div>
