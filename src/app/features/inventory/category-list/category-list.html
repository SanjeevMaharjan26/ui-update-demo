<nx-page-header
  title="Categories"
  subtitle="Product category management"
  [breadcrumbs]="[{ label: 'Home', route: '/dashboard' }, { label: 'Inventory' }, { label: 'Categories' }]">
</nx-page-header>

<div class="page-content">
  <nx-action-bar>
    <button mat-raised-button color="primary" (click)="toggleAdd()">
      <mat-icon>add</mat-icon> Add Category
    </button>
  </nx-action-bar>

  <div class="add-form" *ngIf="showAddForm">
    <nx-card title="New Category">
      <div class="form-row">
        <nx-form-field label="Category Name" [required]="true">
          <input matInput placeholder="e.g. Bearings" />
        </nx-form-field>
        <nx-form-field label="Description">
          <input matInput placeholder="Short description" />
        </nx-form-field>
        <button mat-raised-button color="primary">Save</button>
        <button mat-stroked-button (click)="toggleAdd()">Cancel</button>
      </div>
    </nx-card>
  </div>

  <nx-table [columns]="columns" [data]="categories" [showIndex]="false"></nx-table>
</div>
