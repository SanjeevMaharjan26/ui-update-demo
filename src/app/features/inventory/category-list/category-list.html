<nx-page-header
  title="Categories"
  subtitle="Product category management"
  [breadcrumbs]="[{ label: 'Home', route: '/dashboard' }, { label: 'Inventory' }, { label: 'Categories' }]">
</nx-page-header>

<div class="page-content">
  <nx-action-bar>
    <button mat-raised-button color="primary" (click)="openAddCategoryDialog()">
      <mat-icon>add</mat-icon> Add Category
    </button>
  </nx-action-bar>

  <nx-grid mode="simple" [columns]="columns" [data]="categories" [showIndex]="false"></nx-grid>
</div>
