<nx-dialog-form-wrapper
  title="Add Product"
  [saveDisabled]="form.invalid"
  (save)="save()"
  (cancel)="cancel()">

  <form [formGroup]="form" class="dialog-form">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>SKU</mat-label>
        <input matInput formControlName="sku" placeholder="e.g. PRD-001">
        <mat-error *ngIf="form.get('sku')?.hasError('required')">SKU is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Product Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter product name">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Product name is required</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <input matInput formControlName="category" placeholder="e.g. Electronics">
        <mat-error *ngIf="form.get('category')?.hasError('required')">Category is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let opt of statusOptions" [value]="opt">{{ opt }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('status')?.hasError('required')">Status is required</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Unit Price</mat-label>
        <input matInput type="number" formControlName="unitPrice" placeholder="0.00">
        <span matTextPrefix>$&nbsp;</span>
        <mat-error *ngIf="form.get('unitPrice')?.hasError('required')">Unit price is required</mat-error>
        <mat-error *ngIf="form.get('unitPrice')?.hasError('min')">Must be 0 or more</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Stock Qty</mat-label>
        <input matInput type="number" formControlName="stockQty">
        <mat-error *ngIf="form.get('stockQty')?.hasError('required')">Stock qty is required</mat-error>
        <mat-error *ngIf="form.get('stockQty')?.hasError('min')">Must be 0 or more</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Reorder Level</mat-label>
        <input matInput type="number" formControlName="reorderLevel">
        <mat-error *ngIf="form.get('reorderLevel')?.hasError('required')">Reorder level is required</mat-error>
        <mat-error *ngIf="form.get('reorderLevel')?.hasError('min')">Must be 0 or more</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Supplier</mat-label>
        <input matInput formControlName="supplier" placeholder="Enter supplier name">
      </mat-form-field>
    </div>
  </form>
</nx-dialog-form-wrapper>
