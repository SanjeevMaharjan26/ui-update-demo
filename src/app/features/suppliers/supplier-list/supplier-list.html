<nx-page-header title="Suppliers" subtitle="Manage supplier relationships"
  [breadcrumbs]="[{ label: 'Home', route: '/dashboard' }, { label: 'Suppliers' }, { label: 'Supplier List' }]">
</nx-page-header>
<div class="page-content">
  <nx-action-bar>
    <button mat-raised-button color="primary" (click)="openAddDialog()"><mat-icon>add</mat-icon> Add Supplier</button>
    <button mat-stroked-button><mat-icon>download</mat-icon> Export</button>
    <span class="flex-1"></span>
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Country</mat-label>
      <mat-select>
        <mat-option value="">All Countries</mat-option>
        <mat-option value="US">United States</mat-option>
        <mat-option value="DE">Germany</mat-option>
        <mat-option value="UK">United Kingdom</mat-option>
      </mat-select>
    </mat-form-field>
  </nx-action-bar>
  <nx-grid [columns]="columns" [data]="suppliers" [showSearch]="true" searchPlaceholder="Search suppliers…" [pageSize]="10"></nx-grid>
</div>
