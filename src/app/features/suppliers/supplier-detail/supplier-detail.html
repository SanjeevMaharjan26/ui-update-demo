<nx-page-header [title]="supplier?.name || 'Supplier Detail'"
  [breadcrumbs]="[{ label: 'Home', route: '/dashboard' }, { label: 'Suppliers' }, { label: 'Supplier List', route: '/suppliers/list' }, { label: supplier?.code || '' }]">
  <div actions *ngIf="supplier">
    <nx-status-chip [status]="supplier.status"></nx-status-chip>
    <button mat-raised-button color="primary" (click)="save()"><mat-icon>save</mat-icon> Save</button>
  </div>
</nx-page-header>

<div class="page-content" *ngIf="form && supplier">
  <mat-tab-group [(selectedIndex)]="activeTab" class="detail-tabs">
    <mat-tab label="Info">
      <div class="tab-content">
        <form [formGroup]="form">
          <div class="form-grid">
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Supplier Name <span class="req-mark"> *</span></mat-label><input matInput formControlName="name" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Category</mat-label><input matInput formControlName="category" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Country</mat-label><input matInput formControlName="country" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>City</mat-label><input matInput formControlName="city" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Email</mat-label><input matInput formControlName="email" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Phone</mat-label><input matInput formControlName="phone" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Website</mat-label><input matInput formControlName="website" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Tax ID</mat-label><input matInput formControlName="taxId" /></mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Payment Terms</mat-label>
              <mat-select formControlName="paymentTerms">
                <mat-option value="Net 30">Net 30</mat-option>
                <mat-option value="Net 45">Net 45</mat-option>
                <mat-option value="Net 60">Net 60</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline" nxFormField>
              <mat-label>Currency</mat-label>
              <mat-select formControlName="currency">
                <mat-option value="USD">USD</mat-option>
                <mat-option value="EUR">EUR</mat-option>
                <mat-option value="GBP">GBP</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </form>
      </div>
    </mat-tab>
    <mat-tab label="Contacts">
      <div class="tab-content">
        <app-supplier-contacts [supplierId]="supplier.id" [contacts]="supplier.contacts"></app-supplier-contacts>
      </div>
    </mat-tab>
    <mat-tab label="Orders">
      <div class="tab-content">
        <nx-empty-state message="Purchase order history will appear here" icon="shopping_cart"></nx-empty-state>
      </div>
    </mat-tab>
    <mat-tab label="Performance">
      <div class="tab-content">
        <div class="perf-stats">
          <div class="perf-stat">
            <span class="perf-label">On-Time Delivery</span>
            <span class="perf-value">{{ supplier.rating >= 4 ? '94%' : supplier.rating >= 3 ? '78%' : '62%' }}</span>
          </div>
          <div class="perf-stat">
            <span class="perf-label">Quality Score</span>
            <span class="perf-value">{{ supplier.rating }}/5</span>
          </div>
          <div class="perf-stat">
            <span class="perf-label">Open POs</span>
            <span class="perf-value">{{ supplier.id <= 4 ? 2 : 1 }}</span>
          </div>
        </div>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
