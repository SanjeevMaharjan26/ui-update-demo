<nx-page-header title="Requisitions" subtitle="Purchase requisitions awaiting action"
  [breadcrumbs]="[{ label: 'Home', route: '/dashboard' }, { label: 'Purchasing' }, { label: 'Requisitions' }]">
</nx-page-header>
<div class="page-content">
  <nx-action-bar>
    <button mat-raised-button color="primary"><mat-icon>add</mat-icon> New Requisition</button>
  </nx-action-bar>
  <nx-data-grid [columns]="columns" [data]="requisitions" [showSearch]="true" searchPlaceholder="Search requisitions…" [pageSize]="10"></nx-data-grid>
</div>
