<nx-dialog-form-wrapper
  title="Invite User"
  [saveDisabled]="form.invalid"
  (save)="save()"
  (cancel)="cancel()">

  <form [formGroup]="form" class="dialog-form">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. John Doe">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="user@nexus.com">
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email format</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let opt of roleOptions" [value]="opt">{{ opt }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('role')?.hasError('required')">Role is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let opt of statusOptions" [value]="opt">{{ opt }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('status')?.hasError('required')">Status is required</mat-error>
      </mat-form-field>
    </div>
  </form>
</nx-dialog-form-wrapper>
